name: Daily Aritzia Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: write

concurrency:
  group: daily-aritzia-scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Playwright 1.65 does supports Ubuntu 26.04, which `ubuntu-latest`
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper pipeline
        env:
          CI: 'true'
          HEADLESS: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run pipeline

      - name: Commit generated artifacts
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add -f data/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update scraped data $(date -u +'%Y-%m-%d')"
          git push
